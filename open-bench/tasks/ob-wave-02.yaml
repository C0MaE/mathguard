# Open benchmark task, CC BY 4.0 (see open-bench/LICENSE).
id: ob-wave-02
source: written for the mathguard open benchmark (CC BY 4.0)
subject: Optics and waves
topic: Doppler effect
statement: |
  An ambulance sounds a tone of $f_0 = 440\,\mathrm{Hz}$ and drives straight towards a person at rest
  with $v = 30\,\mathrm{m/s}$. The speed of sound is $c = 343\,\mathrm{m/s}$. Which frequency does the
  person hear?
given:
  f0: 440 Hz
  v: 30 m/s
  c: 343 m/s
assumptions:
  c: positive
  f0: positive
  v: positive
wanted:
  f:
    description: observed frequency
    unit: Hz
reference:
  status: checked
  checked_by: two independent paths, bench.py validate
  f:
    path_a:
      description: moving source, observer at rest
      formula: f0 c / (c - v)
    path_b:
      description: the wavelength in front of the source shrinks to (c - v)/f0
      formula: f0 / (1 - v / c)
    value: 482.17
    rel_tol: 0.001
