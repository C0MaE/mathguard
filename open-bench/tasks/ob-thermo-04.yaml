# Open benchmark task, CC BY 4.0 (see open-bench/LICENSE).
id: ob-thermo-04
source: written for the mathguard open benchmark (CC BY 4.0)
subject: Thermodynamics
topic: Adiabatic compression
statement: |
  Air ($\gamma = 1.4$) at $T_1 = 300\,\mathrm{K}$ is compressed adiabatically and reversibly from
  $V_1 = 1\,\mathrm{L}$ to $V_2 = 0.1\,\mathrm{L}$. Treat it as an ideal gas. What is its final temperature?
given:
  gamma: '1.4'
  T1: 300 K
  V1: 1 L
  V2: 0.1 L
assumptions:
  T1: positive
  V1: positive
  V2: positive
  gamma: positive
wanted:
  T2:
    description: final temperature
    unit: K
reference:
  status: checked
  checked_by: two independent paths, bench.py validate
  T2:
    path_a:
      description: adiabatic relation T V^(gamma-1) = const
      formula: T1 (V1 / V2)**(gamma - 1)
    path_b:
      description: p V^gamma = const combined with p V = n R T
      formula: T1 * (V1 / V2)**gamma * V2 / V1
    value: 753.57
    rel_tol: 0.001
