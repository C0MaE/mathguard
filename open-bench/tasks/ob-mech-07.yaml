# Open benchmark task, CC BY 4.0 (see open-bench/LICENSE).
id: ob-mech-07
source: written for the mathguard open benchmark (CC BY 4.0)
subject: Mechanics
topic: Physical pendulum
statement: |
  A thin uniform rod of length $L = 1\,\mathrm{m}$ swings about a horizontal axis through one of its
  ends. What is the period of small oscillations? $g = 9.81\,\mathrm{m/s^2}$.
given:
  L: 1 m
  g: 9.81 m/s^2
auxiliary:
  m: kg
assumptions:
  L: positive
  g: positive
  m: positive
wanted:
  T:
    description: period of small oscillations
    unit: s
reference:
  status: checked
  checked_by: two independent paths, bench.py validate
  T:
    path_a:
      description: physical pendulum with I = m L^2/3 and d = L/2
      formula: 2 pi sqrt(2 L / (3 g))
    path_b:
      description: Steiner's theorem for I, T = 2 pi sqrt(I/(m g d))
      formula: 2 pi sqrt((m L**2 / 12 + m (L/2)**2) / (m g L / 2))
    value: 1.638
    rel_tol: 0.001
