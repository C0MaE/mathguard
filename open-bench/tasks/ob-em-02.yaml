# Open benchmark task, CC BY 4.0 (see open-bench/LICENSE).
id: ob-em-02
source: written for the mathguard open benchmark (CC BY 4.0)
subject: Electromagnetism
topic: RC discharge
statement: |
  A capacitor with $C = 47\,\mathrm{\mu F}$ discharges through a resistor $R = 10\,\mathrm{k\Omega}$.
  After what time has the voltage dropped to half its initial value?
given:
  C: 47 uF
  R: 10 kohm
assumptions:
  C: positive
  R: positive
wanted:
  t:
    description: time until half the initial voltage
    unit: s
reference:
  status: checked
  checked_by: two independent paths, bench.py validate
  t:
    path_a:
      description: U = U0 exp(-t/(R C)) set to U0/2
      formula: R C log(2)
    path_b:
      description: logarithm of the ratio U/U0 = 1/2
      formula: -R C log(1/2)
    value: 0.32578
    rel_tol: 0.001
