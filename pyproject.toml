[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mathguard"
version = "0.4.0"
description = "Verify mathematical claims from people and language models: identities, derivations, calculus, solutions and physical units."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "C0MaE" }]
keywords = ["verification", "sympy", "llm", "computer-algebra", "dimensional-analysis", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = ["sympy>=1.12", "pint>=0.23", "pyyaml>=6", "mcp>=1.2"]

[project.urls]
Homepage = "https://github.com/C0MaE/mathguard"
Source = "https://github.com/C0MaE/mathguard"
Changelog = "https://github.com/C0MaE/mathguard/blob/main/CHANGELOG.md"
Issues = "https://github.com/C0MaE/mathguard/issues"

[project.optional-dependencies]
mcp = []  # kept so that "mathguard[mcp]" still installs; mcp is a core dependency since 0.3.1
bench = ["pyyaml>=6"]
inspect = ["inspect-ai>=0.3.100"]
dev = ["pytest>=7", "pyyaml>=6", "ruff>=0.6", "inspect-ai>=0.3.100"]

[project.scripts]
mathguard = "mathguard.cli:main"
mathguard-mcp = "mathguard.mcp_server:main"

[tool.setuptools]
packages = ["mathguard", "mathguard.open_bench"]

[tool.setuptools.package-dir]
"" = "src"
# The open benchmark ships with the package, so that "inspect eval mathguard/open_bench" works
"mathguard.open_bench" = "open-bench"

[tool.setuptools.package-data]
mathguard = ["py.typed"]
"mathguard.open_bench" = ["tasks/*.yaml", "LICENSE", "README.md"]

[project.entry-points.inspect_ai]
mathguard = "mathguard.inspect_scorer"

[tool.pytest.ini_options]
testpaths = ["tests", "src/mathguard"]
addopts = "--doctest-modules --ignore=src/mathguard/mcp_server.py --ignore=src/mathguard/inspect_scorer.py"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
