name: Wrong verdict
description: mathguard said verified, refuted, correct or wrong, and that is not right.
labels: ["wrong verdict"]
body:
  - type: markdown
    attributes:
      value: |
        A wrong `verified` or `correct` is the worst bug mathguard can have, so thank you for reporting it.
        Please keep the input as small as you can. Do not paste exercise texts you are not allowed to share.
  - type: textarea
    id: input
    attributes:
      label: Input
      description: The exact call, command or JSON check. For `check_answer`/`grade`, the answer and the reference.
      render: python
    validations:
      required: true
  - type: textarea
    id: got
    attributes:
      label: What mathguard said
      description: Status and message (`--json` output is best).
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What it should say, and why
      description: For example a counterexample, a reference, or a link to a derivation.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versions
      description: Output of `mathguard --version` and `python -c "import sympy, pint; print(sympy.__version__, pint.__version__)"`
    validations:
      required: true
